name: Deploy production to cPanel

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: api.avances.com.br/
          protocol: ftps
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/vendor/**
            **/.env*
            **/index.php
            **/storage/**
            **/tests/**
            **/bootstrap/cache/**
            **/public/storage/**
            **/public/hot
            **/package*.json
            **/vite.config.*
            **/webpack.mix.js
